<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大乐透 AI 实验台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>大乐透 AI 实验台</h1>
          <p id="refreshStatus">页面已打开，正在同步最新开奖数据...</p>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="ghost">刷新数据</button>
          <button id="evaluateBtn" class="ghost">评估已保存预测</button>
        </div>
      </header>

      <section class="metrics" id="summaryCards">
        <div class="metric"><span>历史期数</span><strong>-</strong></div>
        <div class="metric"><span>最新期号</span><strong>-</strong></div>
        <div class="metric"><span>最新开奖号码</span><strong>-</strong></div>
        <div class="metric"><span>待评估预测</span><strong>-</strong></div>
      </section>

      <main class="grid">
        <section class="panel generator">
          <div class="panel-head">
            <h2>生成预测</h2>
            <span>模型或随机</span>
          </div>

          <div class="segmented" role="group" aria-label="生成模式">
            <button class="segment active" data-mode="model">模型预测</button>
            <button class="segment" data-mode="random">完全随机</button>
          </div>

          <label>
            模型
            <select id="modelSelect">
              <option value="logistic">Logistic 快速基线</option>
              <option value="hist_gradient_boosting">Hist Gradient Boosting</option>
              <option value="gradient_boosting">Gradient Boosting</option>
              <option value="random_forest">Random Forest</option>
              <option value="extra_trees">Extra Trees</option>
              <option value="mlp">MLP Neural Net</option>
            </select>
          </label>

          <div class="field-row">
            <label>
              注数
              <input id="ticketCount" type="number" min="1" max="200" value="10" />
            </label>
            <label>
              候选池
              <input id="candidateCount" type="number" min="100" max="1000000" step="1000" value="20000" />
            </label>
          </div>

          <label>
            训练窗口（最近多少期，0=全部）
            <input id="trainWindow" type="number" min="0" max="5000" step="50" value="0" />
          </label>

          <label>
            或按月份训练（近几个月，0=不用月份）
            <input id="trainMonths" type="number" min="0" max="240" value="0" />
          </label>

          <label class="checkline">
            <input id="autoTrain" type="checkbox" checked />
            <span>模型落后最新期号时自动重新训练</span>
          </label>

          <label class="checkline">
            <input id="savePrediction" type="checkbox" checked />
            <span>保存本次预测，等下一期开奖后自动对比</span>
          </label>

          <button id="predictBtn" class="primary">生成并保存</button>

          <div class="ticket-list" id="ticketList"></div>
        </section>

        <section class="panel history">
          <div class="panel-head">
            <h2>历史开奖</h2>
            <input id="historySearch" type="search" placeholder="搜索期号" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>期号</th>
                  <th>前区</th>
                  <th>后区</th>
                  <th>日期</th>
                </tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel models">
          <div class="panel-head">
            <h2>模型状态</h2>
            <button id="trainBtn" class="ghost">训练所选模型</button>
          </div>
          <div id="modelCards" class="model-cards"></div>
          <div id="trainResult" class="chart-list"></div>
        </section>

        <section class="panel predictions">
          <div class="panel-head">
            <h2>预测记录</h2>
            <span>保存后自动等待下一期开奖</span>
          </div>
          <div id="predictionList" class="prediction-list"></div>
        </section>

        <section class="panel holdout">
          <div class="panel-head">
            <h2>模型能力评估</h2>
            <span>Train/Test vs 随机</span>
          </div>
          <div class="field-row">
            <label>
              截止期号
              <input id="holdoutIssue" type="text" value="25000" />
            </label>
            <label>
              测试期数
              <input id="holdoutDraws" type="number" min="1" max="500" value="50" />
            </label>
          </div>
          <div class="field-row">
            <label>
              每期注数
              <input id="holdoutTickets" type="number" min="1" max="50" value="5" />
            </label>
            <label>
              候选池
              <input id="holdoutCandidates" type="number" min="100" max="100000" step="100" value="1000" />
            </label>
          </div>
          <button id="holdoutBtn" class="primary">开始模型能力评估</button>
          <div id="holdoutResult" class="metrics-table"></div>
        </section>

        <section class="panel recommender">
          <div class="panel-head">
            <h2>自动推荐</h2>
            <span>自动给出当前最佳组合</span>
          </div>
          <label>
            候选窗口（逗号分隔，all=全部）
            <input id="recommendWindows" type="text" value="300,all" />
          </label>
          <label>
            候选模型（逗号分隔）
            <input id="recommendModels" type="text" value="logistic,hist_gradient_boosting" />
          </label>
          <button id="recommendBtn" class="primary">运行自定义搜索</button>
          <div id="recommendResult" class="metrics-table"></div>
        </section>

        <section class="panel performance">
          <div class="panel-head">
            <h2>模型表现</h2>
            <span>真实开奖对比</span>
          </div>
          <div id="metricsTable" class="metrics-table"></div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
